# vLLM (V1 engine) serving runtime. The KV cache is one pre-allocated pool sized from gpu_memory_utilization,
# so there is no caching-allocator headroom; the fixed overhead is the non-torch memory vLLM reports at startup
# (CUDA context, cuBLAS / NCCL workspaces). Calibrated on RTX 4090, vLLM 0.30, Qwen2.5-0.5B.
#
# Activations: vLLM packs all sequences into one batch of at most max_num_batched_tokens tokens, so the language
# model's activation memory is charged once for min(context x concurrency, max_batched_tokens) tokens, not per
# sequence (docs/adr/0003). max_num_seqs is not modeled.
id: vllm
runtime_overhead_bytes: 402653184
allocator_factor: 1.0
# Efficiency coefficients for the roofline floor; refined later by measured feedback (stage S15).
eta_bw: 0.6
mfu: 0.35
activation_model: batched
max_batched_tokens: 8192

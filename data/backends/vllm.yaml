# vLLM (V1 engine) serving runtime. The KV cache is one pre-allocated pool sized from gpu_memory_utilization,
# so there is no caching-allocator headroom; the fixed overhead is the non-torch memory vLLM reports at startup
# (CUDA context, cuBLAS / NCCL workspaces). Calibrated on RTX 4090, vLLM 0.30, Qwen2.5-0.5B (docs/PROGRESS.md).
#
# Known limitation (docs/PROGRESS.md D-9): the estimator still charges every sequence its own activation memory, as
# HF eager does, while vLLM bounds activations by max_num_batched_tokens. Weights and peak memory match what vLLM
# reports; max_concurrency is a conservative lower bound (74 estimated vs 509 measured for Qwen2.5-0.5B at 1k context).
id: vllm
runtime_overhead_bytes: 402653184
allocator_factor: 1.0
# Efficiency coefficients for the roofline floor; refined later by measured feedback (stage S15).
eta_bw: 0.6
mfu: 0.35

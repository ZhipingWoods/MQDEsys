# Installed runtime detection sources (T-R24)
# Paths and ports are configurable; timeout per source: 400 ms

sources:
  - name: ollama
    type: http
    url: http://127.0.0.1:11434/api/tags
    timeout_ms: 400
    
  - name: lm_studio
    type: http
    url: http://127.0.0.1:1234/v1/models
    timeout_ms: 400
    
  - name: llamacpp
    type: http
    url: http://127.0.0.1:8080/v1/models
    timeout_ms: 400
    
  - name: vllm
    type: http
    url: http://127.0.0.1:8000/v1/models
    timeout_ms: 400
    
  - name: mlx
    type: filesystem
    paths:
      - ~/.cache/huggingface/hub
    pattern: "models--.*"
    
  - name: docker_model_runner
    type: http
    url: http://127.0.0.1:5000/v1/models
    timeout_ms: 400
    
  - name: ramalama
    type: filesystem
    paths:
      - ~/.local/share/ramalama
    pattern: "models--.*"
    
  - name: hf_cache
    type: filesystem
    paths:
      - ~/.cache/huggingface/hub
      - $HF_HOME/hub
    pattern: "models--.*"

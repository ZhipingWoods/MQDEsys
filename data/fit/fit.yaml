# Deployment pre-evaluation constants — ported from llmfit (3rdpart/llmfit/llmfit-core/src/{fit,models}.rs).
# Changing a value here changes every fit verdict; treat as L2 (see docs/REFERENCES.md §1).

# Bytes per parameter for MEMORY (llmfit models.rs quant_bpp), keyed by our quant labels.
memory_bpp:
  f32: 4.0
  bf16: 2.0
  f16: 2.0
  w8a16: 1.0      # int8 weight-only (llmfit "8-bit")
  w8a8: 1.0
  fp8: 1.0
  w4a16: 0.5      # GPTQ/AWQ-4bit (llmfit 0.5); group metadata is added exactly by the estimator
  w4a8: 0.5
  w2a16: 0.25
  w2a8: 0.25
  q8_0: 1.05
  q6_k: 0.80
  q5_k_m: 0.68
  q4_k_m: 0.58
  q3_k_m: 0.48
  q2_k: 0.37

# Bytes per parameter streamed per token for SPEED (llmfit models.rs speed bpp).
speed_bpp:
  f32: 4.0
  bf16: 2.0
  f16: 2.0
  w8a16: 1.0
  w8a8: 1.0
  fp8: 1.0
  w4a16: 0.5
  w4a8: 0.5
  w2a16: 0.25
  w2a8: 0.25
  q8_0: 1.0
  q6_k: 0.75
  q5_k_m: 0.625
  q4_k_m: 0.5
  q3_k_m: 0.375
  q2_k: 0.25

# Quant hierarchy walked from best quality to smallest (llmfit choose_quant).
quant_hierarchy: [bf16, fp8, w8a16, w4a16, w4a8, w2a16]

# Quality penalty per quant (added to the quality score; llmfit quant_quality_penalty,
# see docs/REFERENCES.md A.2). llmfit's 4-bit GPTQ/AWQ is -3 and its Q4_K_M is -5; our W4A16
# means GPTQ/AWQ-style group quantization, but we keep -5 as the conservative value because
# our recipes also cover activation quantization. W2 follows llmfit's Q2_K at -12.
quant_quality_penalty:
  f32: 0
  bf16: 0
  f16: 0
  fp8: -1
  w8a16: -1
  w8a8: -2
  w4a16: -5
  w4a8: -6
  w2a16: -12
  w2a8: -14

overhead_gb: 0.5
default_context: 8192

fit_thresholds:    # ratio = required / available
  perfect: 0.60
  good: 0.85
  marginal: 0.98

bandwidth_efficiency: 0.55
prefill_compute_utilization: 0.35
run_mode_factor:
  gpu: 1.0
  tensor_parallel: 0.9
  moe_offload: 0.8
  cpu_offload: 0.5
  cpu_only: 0.3

# tok/s = K / params_B * quant_speed_multiplier   (used when GPU bandwidth is unknown)
backend_speed_k:
  cuda: 220
  metal: 160
  rocm: 180
  vulkan: 150
  sycl: 100
  cpu_arm: 90
  cpu_x86: 70
  ascend: 390
quant_speed_multiplier:
  bf16: 0.6
  fp8: 0.8
  w8a16: 0.8
  w4a16: 1.15
  w4a8: 1.15
  w2a16: 1.35
  w2a8: 1.35
default_ddr_bandwidth_gbps: 50

# Score weights [quality, speed, fit, context] and targets per use case (A.3).
use_cases:
  general:    {weights: [0.45, 0.30, 0.15, 0.10], speed_target: 40,  context_target: 4096}
  chat:       {weights: [0.40, 0.35, 0.15, 0.10], speed_target: 40,  context_target: 4096}
  coding:     {weights: [0.50, 0.20, 0.15, 0.15], speed_target: 40,  context_target: 8192}
  reasoning:  {weights: [0.55, 0.15, 0.15, 0.15], speed_target: 25,  context_target: 8192}
  multimodal: {weights: [0.50, 0.20, 0.15, 0.15], speed_target: 40,  context_target: 4096}
  embedding:  {weights: [0.30, 0.40, 0.20, 0.10], speed_target: 200, context_target: 512}
  # MQDEsys extension: robot policies care about control frequency; speed = decision steps / s.
  vla:        {weights: [0.40, 0.35, 0.15, 0.10], speed_target: 10,  context_target: 512}

# Quality base tiers by ACTIVE parameter count in billions (upper bound -> score); llmfit A.1.
quality_tiers:
  - [1, 30]
  - [3, 45]
  - [7, 60]
  - [10, 75]
  - [20, 82]
  - [40, 89]
  - [1000000, 95]

# Added to the quality score when the model family matches (llmfit A.1). Matched as a
# case-insensitive substring of family / model_type / path.
family_quality_bonus:
  deepseek: 3
  qwen: 2
  llama: 2
  minicpm: 2      # MQDEsys extension: our primary family, same tier as qwen/llama
  mistral: 1
  mixtral: 1
  gemma: 1
  starcoder: 1
  phi: 0

# Added when the checkpoint is recent. Age comes from the newest mtime of the model's
# config/weights, since local checkpoints carry no release date.
recency_quality_bonus:
  - [3, 3.0]      # < 3 months -> +3
  - [9, 1.5]      # < 9 months -> +1.5

# Heuristic task bonus when no benchmark record exists (llmfit A.1).
task_quality_bonus:
  coding_name_match: 6    # use_case=coding and the name says coding
  reasoning_large: 5      # use_case=reasoning and >= 13B active params
  vision_multimodal: 6    # use_case=multimodal and the model has a vision tower
reasoning_large_min_b: 13

# Multiplier applied to the K-constant speed path when the host has many CPU cores (A.4).
many_cores_threshold: 8
many_cores_speed_bonus: 1.1

# MoE two-tier decode model (docs/REFERENCES.md A.5; llmfit fit.rs:1360-1510 and 1720-1845).
# Applies in GPU and MoE-offload run modes only (tensor-parallel MoE uses the dense formula, as llmfit).
moe:
  # Tier 1 (expert geometry known): tps = bw / (active_ffn_B * memory_bpp + fixed_B * fixed_bpp).
  # No bandwidth-efficiency factor: fixed_bpp is a bandwidth-equivalent width that already absorbs it.
  tier1_fixed_bpp: 3.2
  tier1_fixed_bpp_by_arch: {gpt_oss: 1.43}
  # Tier 2 (fallback): tps = bw / (active_B * memory_bpp) * efficiency * overhead.
  tier2_by_arch:                  # [efficiency, overhead], matched by model_type prefix
    gpt_oss: [0.72, 0.80]
    deepseek_v3: [0.62, 0.70]
    deepseek_v4: [0.62, 0.70]
  tier2_overhead_by_experts:      # [max experts, overhead]; first row whose bound >= n_experts
    - [8, 0.90]
    - [16, 0.85]
    - [32, 0.80]
    - [64, 0.70]
  tier2_overhead_many: 0.40       # more than the last bound (128+ experts)
  tier2_overhead_unknown: 0.60
  # VRAM cache-pressure penalty (GPU mode only): util = total_params * memory_bpp / VRAM.
  #   util > 1.0 or util < threshold -> 1.0
  #   else max(floor, 1 - (util - threshold) * inactive_ratio), inactive_ratio = 1 - active/n_experts
  vram_pressure_threshold: 0.60
  vram_pressure_floor: 0.30
  default_expert_ratio: 0.50      # inactive_ratio when n_experts is unknown

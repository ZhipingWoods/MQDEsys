id: vlm
order: 20  # wizard tab position: LLM, VLM, VLA, WM, EWM
display_name: VLM（视觉-语言）
model_families: [minicpmv, qwen3_5]
applicable_recipes: []
classic_algorithms:
  - name: rtn
    note: per-component RTN; the pipeline attributes error to the vision tower and the language model separately
  - name: gptq
    note: layer-wise, calibrated on image+text samples (vision tower and language model quantized from their own activations)
  - name: awq
    note: activation-aware scaling, same calibration; not yet checked on a VLM
default_eval_dataset: synthetic
pipeline_status: implemented  # python/mqde/pipeline/vlm_job.py (MiniCPM-V 4.6); Qwen3.5-VL shares the engine but is untested

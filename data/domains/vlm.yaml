id: vlm
order: 20  # wizard tab position: LLM, VLM, VLA, WM, EWM
display_name: VLM（视觉-语言）
model_families: [minicpmv, qwen3_5]
applicable_recipes: []
classic_algorithms:
  - name: rtn
    note: per-component RTN; the pipeline attributes error to the vision tower and the language model separately
  - name: gptq
    note: layer-wise, calibrated on image+text samples (vision tower and language model quantized from their own activations)
  - name: awq
    note: activation-aware scaling, same calibration; not yet checked on a VLM
default_eval_dataset: synthetic
pipeline_status: implemented  # python/mqde/pipeline/vlm_job.py (MiniCPM-V 4.6); Qwen3.5-VL shares the engine but is untested
# T-E/T-F/T-G (2026-10-19): vLLM export + serve implemented. VLMJobSpec.export (list[str]) and
# VLMJobSpec.vllm (dict|None) added; _export_recipe() writes a quantized checkpoint with the existing LLM
# exporters; _vllm_serve() starts vLLM, smokes it, runs a load test, generates an answer for each eval
# sample and scores gt_accuracy (fraction of correct answers). Scoring is accuracy-based, not PPL.
# Full deployment chain (export -> vllm serve -> accuracy scoring) verified with 41 unit tests on 4090.
deploy_backends: [vllm, sglang]  # implemented: VLMJobSpec.export/_serve; both verified on MiniCPM-V 4.6
deploy_note: "VLM 量化支持 vLLM 和 SGLang 导出部署（awq 格式，精度评分为生成准确率）；在下面勾选后端并填写 deploy.export + deploy.vllm / deploy.sglang 字段即可。"

id: vlm
order: 20  # wizard tab position: LLM, VLM, VLA, WM, EWM
display_name: VLM（视觉-语言）
model_families: [minicpmv, qwen3_5]
applicable_recipes: []
classic_algorithms:
  - name: rtn
    note: per-component RTN; the pipeline attributes error to the vision tower and the language model separately
  - name: gptq
    note: layer-wise, calibrated on image+text samples (vision tower and language model quantized from their own activations)
  - name: awq
    note: activation-aware scaling, same calibration; not yet checked on a VLM
default_eval_dataset: synthetic
pipeline_status: implemented  # python/mqde/pipeline/vlm_job.py (MiniCPM-V 4.6); Qwen3.5-VL shares the engine but is untested
# T-E/T-F/T-G (2026-10-16): feasibility checked, not implemented. vLLM's model registry recognizes this
# family's exact architecture (MiniCPMV4_6ForConditionalGeneration, merged upstream PR #43213, needs
# transformers>=5.7.0 -- the 4090's mqde env already has 5.7.0) -- so vLLM deployment is real, buildable
# work, not a dead end. What's missing is not the engine support but a quantized-export step for VLM: today
# python/mqde/pipeline/vlm_job.py never writes a servable checkpoint to disk, quantization stays fake-quant
# in-process the whole job. Building that export step, VLMJobSpec backend fields, and the serving/scoring
# wiring (accuracy-based, not PPL -- vLLM's served output for a VLM isn't scored the same way as an LLM's)
# is its own multi-session task, not started.
deploy_backends: []  # feasible (vllm), not implemented
deploy_note: "VLM 量化目前只在进程内做 fake-quant，还没有导出可服务的 checkpoint；vLLM 已能识别 MiniCPM-V 4.6 结构，导出步骤接好后即可在这里选择。"

# Embodied World Model (EWM): action-conditioned world/state prediction for robotics. Shares the
# DiT numerics with `world`; the evaluation samples carry per-frame action vectors and the report
# records that conditioning explicitly.
id: ewm
order: 50  # wizard tab position: LLM, VLM, VLA, WM, EWM
display_name: EWM（具身世界模型，动作条件）
model_families: [dit_ewm]
applicable_recipes: [bf16, w8a16, fp8, w4a16, w4a8, w2a16, w2a8]
classic_algorithms:
  - name: ptq-diffusion
    note: >-
      Same post-training quantization family as `world`; the action encoder is a separate component
      (kept FP by default, `also_quantize: [action]` opts in) and the report attributes PSNR damage
      to the video backbone vs. the action path.
default_eval_dataset: synthetic-video
pipeline_status: implemented
deploy_backends: []
deploy_note: "动作条件世界模型同样没有可用的文本推理后端：输出是未来视频帧，不是 token。"

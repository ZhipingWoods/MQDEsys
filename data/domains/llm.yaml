# T-1301: top-level domain registry. id must match modelspec::ModelFamily.modality for families this
# domain covers (see cpp/include/mqde/modelspec/model_spec.h).
id: llm
order: 10  # wizard tab position: LLM, VLM, VLA, WM, EWM
display_name: LLM（纯语言模型）
model_families: [decoder_llm, generic_decoder]
applicable_recipes: []  # empty = no domain-specific restriction today; every data/recipes/*.yaml applies
classic_algorithms:
  - name: rtn
    note: round-to-nearest baseline, no calibration needed (implemented, python/mqde/quant/algorithms.py)
  - name: gptq
    note: per-layer OBS-style reconstruction (implemented, T-0602)
  - name: awq
    note: activation-aware per-channel scaling (implemented, T-0601)
default_eval_dataset: wikitext2
pipeline_status: implemented  # python/mqde/pipeline/llm_job.py
# T-E/T-F/T-G (2026-10-16): which serving backends a quantized export of this domain can be deployed to.
# Not yet read by any loader (cpp/src/estimator/domain.cpp ignores unknown keys) -- recorded now so the
# answer is in one place instead of re-discovered per session; a future BackendCards gating change can read
# this instead of NewJob.tsx's current `kind === "llm"` check.
deploy_backends: [llamacpp, vllm, sglang]  # python/mqde/pipeline/llm_job.py: all three implemented
deploy_note: "三个后端均已实现（python/mqde/pipeline/llm_job.py）。"

# Architecture template: Qwen3.5 / Qwen3.8 VL (hybrid Gated-DeltaNet + full attention LM, ViT, MTP head).
# Validated with a block-wise FP8 checkpoint using 128x128 weight blocks.
family: qwen3_5
modality: vlm
match:
  model_type: [qwen3_5, qwen3_5_moe]

config_paths:
  text: [text_config]
  vision: [vision_config]

tokens_per_image: 0   # dynamic resolution; derived from patch grid at estimate time

components:
  - name: vision
    modality: vision
    prefix: model.visual.blocks.
    block_regex: '^(\d+)\.'
  - name: merger
    modality: vision
    prefix: model.visual.
  - name: language
    modality: language
    prefix: model.language_model.
    block_regex: 'layers\.(\d+)\.'
  - name: lm_head
    modality: language
    prefix: lm_head.
  - name: mtp
    modality: mtp          # multi-token-prediction head; not quantized by default recipes
    prefix: mtp.
    block_regex: 'layers\.(\d+)\.'

default_keep_fp:
  - 'embed_tokens'
  - 'lm_head'
  - 'patch_embed'
  - 'pos_embed'
  - 'linear_attn\.in_proj_[ab]\.'
  - 'mlp\.gate\.'              # MoE router
  - 'shared_expert_gate'

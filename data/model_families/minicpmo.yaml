# Architecture template: MiniCPM-o (omni: SigLIP vision + resampler, Whisper-style audio, LLM, TTS).
family: minicpmo
modality: omni
match:
  model_type: [minicpmo]

config_paths:
  text: []          # LM fields live at the top level of config.json
  vision: [vision_config]

tokens_per_image: 64

components:
  - name: vision
    modality: vision
    prefix: vpm.
    block_regex: 'encoder\.layers\.(\d+)\.'
  - name: merger
    modality: vision
    prefix: vit_merger.
  - name: resampler
    modality: vision
    prefix: resampler.
  - name: audio
    modality: audio
    prefix: apm.
    block_regex: 'layers\.(\d+)\.'
  - name: audio_proj
    modality: audio
    prefix: audio_projection_layer.
  - name: language
    modality: language
    prefix: llm.model.
    block_regex: 'layers\.(\d+)\.'
  - name: lm_head
    modality: language
    prefix: llm.lm_head.
  - name: tts
    modality: tts
    prefix: tts.
    block_regex: 'layers\.(\d+)\.'

default_keep_fp:
  - 'embed_tokens'
  - 'lm_head'
  - 'patch_embedding'
  - 'position_embedding'
  - 'embed_positions'
  - 'linear_attn\.in_proj_[ab]\.'
  - 'shared_expert_gate'
  - 'mlp\.gate\.'
  - 'emb_code'
  - 'head_code'

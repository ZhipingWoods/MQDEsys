# Qwen2-VL / Qwen2.5-VL / Qwen3-VL family: a ViT with 2-D rotary position embeddings, a merger,
# and a Qwen language model. Module tree follows the native transformers implementation:
#   model.visual.{patch_embed,blocks.N,merger}  model.language_model.layers.N  lm_head
family: qwen_vl
modality: vlm
match:
  model_type: [qwen2_vl, qwen2_5_vl, qwen2_5_vl_moe, qwen3_vl, qwen3_vl_moe]

config_paths:
  text: [text_config]
  vision: [vision_config]

tokens_per_image: 0   # dynamic resolution; the processor decides the patch grid

components:
  - name: vision
    modality: vision
    prefix: model.visual.blocks.
    block_regex: '^(\d+)\.'
  - name: vision_merger
    modality: vision
    prefix: model.visual.merger.
  - name: vision
    modality: vision
    prefix: model.visual.
  - name: language
    modality: language
    prefix: model.language_model.
    block_regex: 'layers\.(\d+)\.'
  - name: lm_head
    modality: language
    prefix: lm_head.

default_keep_fp:
  - 'embed_tokens'
  - 'lm_head'
  - 'patch_embed'
  - 'pos_embed'
  - 'merger'

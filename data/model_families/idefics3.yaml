# Idefics3 / SmolVLM: SigLIP vision tower, pixel-shuffle connector, SmolLM text model.
#   model.vision_model.encoder.layers.N   model.connector   model.text_model.layers.N
family: idefics3
modality: vlm
match:
  model_type: [idefics3, smolvlm]

config_paths:
  text: [text_config]
  vision: [vision_config]

tokens_per_image: 0

components:
  - name: vision
    modality: vision
    prefix: model.vision_model.encoder.layers.
    block_regex: '^(\d+)\.'
  - name: vision
    modality: vision
    prefix: model.vision_model.
  - name: merger
    modality: vision
    prefix: model.connector.
  - name: language
    modality: language
    prefix: model.text_model.
    block_regex: 'layers\.(\d+)\.'
  - name: lm_head
    modality: language
    prefix: lm_head.

default_keep_fp:
  - 'embed_tokens'
  - 'lm_head'
  - 'patch_embedding'
  - 'position_embedding'

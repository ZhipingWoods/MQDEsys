# LLaVA 1.5 / LLaVA-NeXT / LLaVA-OneVision: a CLIP/SigLIP vision tower, one or two projection
# layers, and a decoder language model.
#   model.vision_tower.vision_model.encoder.layers.N
#   model.multi_modal_projector.{linear_1,linear_2}
#   model.language_model.layers.N
family: llava
modality: vlm
match:
  model_type: [llava, llava_next, llava_onevision, llava_next_video, llava_onevision_qwen2_5]

config_paths:
  text: []
  vision: [vision_config]

tokens_per_image: 576   # 336 px / 14 patch = 24 x 24 CLIP patches

components:
  - name: vision
    modality: vision
    prefix: model.vision_tower.vision_model.encoder.layers.
    block_regex: '^(\d+)\.'
  - name: vision
    modality: vision
    prefix: model.vision_tower.vision_model.
  - name: merger
    modality: vision
    prefix: model.multi_modal_projector.
  - name: language
    modality: language
    prefix: model.language_model.
    block_regex: 'layers\.(\d+)\.'
  - name: lm_head
    modality: language
    prefix: lm_head.

default_keep_fp:
  - 'embed_tokens'
  - 'lm_head'
  - 'patch_embedding'
  - 'position_embedding'
  - 'class_embedding'

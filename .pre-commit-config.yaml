# pre-commit run --all-files   (pip install pre-commit)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]  # weights and datasets must never be committed
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: '^python/'
      - id: ruff-format
        files: '^python/'
        stages: [manual]  # the codebase is not ruff-format'ed yet; run explicitly if you want it

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: '^python/mqde/'
        args: [--config-file=python/pyproject.toml]
        additional_dependencies: [numpy, types-PyYAML]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.1
    hooks:
      - id: clang-format
        files: '^cpp/.*\.(c|h|cpp|hpp)$'

  - repo: local
    hooks:
      - id: check-deps
        name: module dependency direction (STRUCTURE.md 3.x)
        entry: python3 scripts/check_deps.py
        language: system
        pass_filenames: false
        files: '^cpp/'

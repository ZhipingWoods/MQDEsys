# The toolchain `scripts/check_all.sh` needs, as a conda environment (what the dev machines already run: see
# `conda env export --from-history -n mqde`). Used by the CI proposal in this directory.
name: mqde-ci
channels:
  - conda-forge
dependencies:
  - python=3.11
  - cmake>=3.27
  - ninja
  - gxx_linux-64=12   # GCC 12 is what -Werror was tuned against; system g++ 11 cannot compile std::async (see T-0704)
  - nlohmann_json
  - fmt
  - cli11
  - spdlog
  - libcurl
  - openssl
  - sqlite
  - yaml-cpp
  - cpp-httplib=0.58
  - gtest
  - pybind11
  - clang-format
  - clang-tools
  - nodejs=20
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - transformers
      - safetensors
      - numpy
      - pyyaml
      - jsonschema
      - pytest
      - ruff
      - mypy
      - pillow

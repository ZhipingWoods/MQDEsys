# PROPOSAL, not active. Copy to .github/workflows/docs.yml after maintainer approval (CI files are L2),
# and set Settings > Pages > Source to "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/site/**", "docs/TASKS.md"]
  pull_request:
    paths: ["docs/site/**", "docs/TASKS.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - run: pip install -r docs/site/requirements.txt
      - name: Check the generated status tables are current
        working-directory: docs/site
        run: |
          python3 scripts/gen_status.py
          git diff --exit-code -- en/_status_tables.md zh/_status_tables.md
      - name: Build English and Chinese (warnings are errors)
        working-directory: docs/site
        run: make html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

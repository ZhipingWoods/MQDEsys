# LLM quantization + PPL evaluation (python -m mqde.pipeline.llm_job examples/jobs/qwen25_05b_wikitext.yaml)
metadata:
  name: qwen25-05b-wikitext
model:
  path: /cache/wuzhiping/hub/Qwen2.5-0.5B-Instruct
quant:
  recipe: [w4a16, w4a8, w2a16]
  algorithm: gptq          # rtn | gptq | awq | smoothquant | awq+gptq | smoothquant+gptq | recipe
  act_static: null         # null = dynamic per-token; minmax | ema | percentile = static per-tensor
  kv: {format: int, bits: 8, symmetric: false, method: kivi}
  mixed_precision:         # first match wins; "block:lo-hi" selects decoder blocks
    rules:
      - {match: "block:0", bits: 8}
      - {match: "mlp\\.down_proj$", bits: 8}
calibration: {n_samples: 32, seq_len: 512}
evaluation: {seq_len: 512, max_windows: 40}
deploy: {device: cpu}
output_dir: runs

apiVersion: mqde/v1
kind: Job
metadata: {name: minicpm-vla-libero10}
model:
  source: local
  path: /path/to/models/MiniCPM-RobotManip
  modality: vla
quant:
  recipe: [w8a16, fp8, w4a16, w4a8, w2a16, w2a8]
calibration: {dataset: /path/to/datasets/lerobot_libero_10_image, n_samples: 16}
evaluation: {dataset: /path/to/datasets/lerobot_libero_10_image, n_samples: 24, concurrency: [1, 4, 16, 64], attribution: true}
deploy: {hardware: nvidia/rtx4090, device: "cuda:0"}
output_dir: runs

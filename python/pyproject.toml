[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "mqde"
version = "0.2.0"
description = "MQDEsys Python executor: quantization algorithms, evaluation and export"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
quant = ["torch>=2.4", "transformers>=4.44", "safetensors>=0.4", "pyarrow>=15"]
export = ["gguf>=0.10"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.18"]

[tool.scikit-build]
# The extension is built by the top-level CMake project (MQDE_WITH_PYTHON=ON).
cmake.source-dir = ".."
cmake.args = ["-DMQDE_WITH_PYTHON=ON"]
wheel.packages = ["mqde"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["../3rdpart"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
  "SIM108", # ternaries are not always clearer than if/else
  "RUF001", "RUF002", "RUF003",  # Chinese comments/docstrings use full-width punctuation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # importorskip must run before the module imports it guards
# Job pipelines pass one-shot closures to _stage(), which calls them before the loop advances,
# so closing over the loop variable is correct here (B023 cannot see that).
"mqde/pipeline/llm_job.py" = ["B023"]
"mqde/pipeline/vla_job.py" = ["B023"]

[tool.mypy]
python_version = "3.10"
files = ["mqde"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "mqde._core"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
